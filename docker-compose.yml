# Entorno local de desarrollo. El despliegue real (8 réplicas en Railway) lo
# mantiene la Persona C; aquí solo levantamos Redis 7 con la misma
# configuración de persistencia que en la nube (AOF everysec).
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-datos:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-datos:
